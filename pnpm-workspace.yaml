# pnpm 12 blocks dependency install scripts by default; only these are allowed/denied explicitly.
allowBuilds:
  esbuild: true
  sharp: true
  # Ships prebuilt bindings via optionalDependencies; its postinstall is only a fallback.
  unrs-resolver: false

# Our own packages (ui-library, tokens, email) are consumed right after we publish them; the
# release-age delay only protects against compromised third-party releases.
minimumReleaseAgeExclude:
  - '@inzumer/*'

# Also install the WebAssembly builds of native packages (napi-rs), used when a native binary
# can't be loaded (e.g. Windows Smart App Control blocking a freshly released `.node` file).
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - wasm32

# Patched versions of vulnerable transitive dependencies (pnpm audit).
overrides:
  'path-to-regexp@>=4.0.0 <6.3.0': '^6.3.0'
